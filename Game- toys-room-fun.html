<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toy Room Fun!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFD23F; --blue:#3EC1F3; --pink:#FF5DA2; --green:#3DCC6B; --orange:#FF8A1F; --purple:#9B6BFF;
  --ink:#2B1B3D; --page:#7FD8FA; --page2:#B8ECFF; --card:#FFFFFF; --card-ink:#2B1B3D;
  --fs-big:clamp(24px,5vh,60px); --fs-btn:clamp(20px,4vh,44px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --page:#1B2A55; --page2:#24386E; --card:#2A1F44; --card-ink:#FFF6DA; color-scheme:dark; } }
:root[data-theme="dark"]{ --page:#1B2A55; --page2:#24386E; --card:#2A1F44; --card-ink:#FFF6DA; color-scheme:dark; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; margin:0; }
body{
  font-family:"Fredoka","Baloo 2","Nunito","Arial Rounded MT Bold","Comic Sans MS",system-ui,sans-serif;
  background:var(--page); background-image:radial-gradient(circle at 20px 20px,var(--page2) 7px,transparent 8px); background-size:56px 56px;
  color:var(--card-ink); overflow:hidden; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
}
.emoji{ font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
button{ font:inherit; cursor:pointer; color:var(--ink); }
button:focus-visible{ outline:5px solid var(--purple); outline-offset:4px; }
.screen{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; }
.screen.on{ display:flex; }
.chunky{ border:5px solid var(--ink); border-radius:28px; min-height:76px; padding:.2em .9em; font-size:var(--fs-btn); font-weight:700; box-shadow:0 8px 0 var(--ink); transition:transform .1s, box-shadow .1s; }
.chunky:active{ transform:translateY(6px); box-shadow:0 2px 0 var(--ink); }
#corner{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); right:12px; display:flex; gap:10px; z-index:50; }
#corner button{ width:62px; height:62px; border-radius:50%; border:4px solid var(--ink); background:#fff; font-size:28px; box-shadow:0 5px 0 var(--ink); display:grid; place-items:center; }
#corner button:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
#start,#home{ justify-content:center; gap:4vh; text-align:center; padding:20px; }
.title{ font-size:clamp(48px,12vh,140px); font-weight:700; margin:0; line-height:1; color:var(--yellow); -webkit-text-stroke:6px var(--ink); paint-order:stroke fill; text-shadow:0 10px 0 var(--ink); }
.title span{ display:inline-block; animation:hop 1.6s ease-in-out infinite; }
.toyrow{ display:flex; gap:1.5vw; justify-content:center; align-items:flex-end; }
.toyrow span{ display:inline-block; animation:hop 1.4s ease-in-out infinite; }
.toyrow img{ height:clamp(56px,12vh,130px); width:auto; display:block; filter:drop-shadow(0 6px 4px rgba(0,0,0,.18)); }
@keyframes hop{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14%)} }
#startBtn{ background:var(--green); font-size:clamp(34px,7vh,80px); padding:.2em 1.4em; }
.menu{ display:flex; flex-wrap:wrap; gap:3vw; justify-content:center; }
.menu .chunky{ min-width:min(30vw,420px); padding:.5em .8em; }

#game{ padding:8px 14px 10px; gap:.8vh; }
.bar{ width:100%; display:flex; align-items:center; gap:12px; padding-right:160px; min-height:68px; }
.homeBtn{ background:#fff; font-size:clamp(20px,3.2vh,32px); min-height:60px; border-radius:22px; }
.gameName{ font-size:clamp(22px,3.8vh,40px); font-weight:700; color:#fff; -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; white-space:nowrap; }
.stars{ display:flex; flex-wrap:wrap; gap:2px; margin-left:auto; font-size:clamp(16px,3vh,30px); }
.stars span{ filter:grayscale(1) opacity(.35); transition:filter .3s; }
.stars span.on{ filter:none; animation:starOn .6s; }
@keyframes starOn{ 0%{transform:scale(0) rotate(-90deg)} 70%{transform:scale(1.6)} 100%{transform:scale(1)} }
.card{ width:min(100%,1600px); background:var(--card); color:var(--card-ink); border:5px solid var(--ink); border-radius:28px; box-shadow:0 7px 0 var(--ink); display:flex; align-items:center; gap:16px; padding:8px 12px 8px 20px; }
.card.slide{ animation:slideIn .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes slideIn{ from{transform:translateX(60px);opacity:0} to{transform:none;opacity:1} }
.count{ font-size:clamp(16px,2.8vh,28px); font-weight:700; background:var(--yellow); color:var(--ink); border:4px solid var(--ink); border-radius:999px; padding:.1em .6em; white-space:nowrap; }
.sentence{ font-size:var(--fs-big); font-weight:600; line-height:1.15; flex:1; }
.sentence b{ color:var(--pink); }
.listen{ background:var(--blue); font-size:clamp(18px,3.2vh,34px); min-height:66px; white-space:nowrap; }
.roomWrap{ flex:1; min-height:0; width:100%; display:flex; justify-content:center; align-items:center; }
#room{ height:100%; max-width:100%; aspect-ratio:1672/941; display:block; touch-action:none; border:5px solid var(--ink); border-radius:24px; box-shadow:0 7px 0 var(--ink); background:#F3E3C8; }
.controls{ width:100%; display:flex; align-items:center; justify-content:center; gap:3vw; min-height:max(86px,13vh); flex-wrap:wrap; }
.shelf{ display:flex; align-items:center; justify-content:center; background:#C98B4E; border:5px solid var(--ink); border-radius:24px; padding:4px 40px; box-shadow:inset 0 -12px 0 #A86B35, 0 6px 0 var(--ink); min-width:min(36vw,380px); height:max(84px,12.5vh); }
.shelfToy{ height:100%; display:flex; align-items:center; touch-action:none; cursor:grab; animation:wig 2.2s ease-in-out infinite; }
.shelfToy img{ max-height:92%; max-width:220px; display:block; pointer-events:none; filter:drop-shadow(0 6px 4px rgba(0,0,0,.25)); }
.shelfToy.gone{ opacity:.25; animation:none; }
.ghost{ position:fixed; z-index:40; pointer-events:none; transform:translate(-50%,-50%) scale(1.15); filter:drop-shadow(0 12px 8px rgba(0,0,0,.35)); }
.ghost img{ display:block; height:100%; width:auto; }
.ghost.back{ transition:left .45s cubic-bezier(.3,1.5,.5,1), top .45s cubic-bezier(.3,1.5,.5,1), transform .45s; transform:translate(-50%,-50%) scale(1); }
.next{ background:var(--orange); animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
.hidden{ display:none !important; }
.choices{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; flex:1 1 640px; max-width:1150px; }
.choice{ display:flex; align-items:center; gap:12px; text-align:left; background:#fff; border:4px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink); font-size:clamp(16px,2.6vh,30px); font-weight:600; line-height:1.15; padding:.25em .7em .25em .35em; min-height:58px; transition:transform .1s, box-shadow .1s, background .2s; }
.choice:active:not(:disabled){ transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
.choice:hover:not(:disabled){ background:#FFF6D6; }
.choice .letter{ flex:none; width:1.8em; height:1.8em; border-radius:50%; display:grid; place-items:center; color:#fff; border:3px solid var(--ink); font-weight:700; -webkit-text-stroke:1px var(--ink); paint-order:stroke fill; }
.choice:nth-child(1) .letter{ background:var(--pink); } .choice:nth-child(2) .letter{ background:var(--blue); }
.choice:nth-child(3) .letter{ background:var(--green); } .choice:nth-child(4) .letter{ background:var(--orange); }
.choice.right{ background:#C9F5D6; animation:pulse 1.2s ease-in-out 2; }
.choice.bad{ background:#FFD6D6; opacity:.6; cursor:default; }
.choice:disabled{ cursor:default; }
.bubble{ position:relative; background:#fff; color:var(--ink); border:5px solid var(--ink); border-radius:30px; padding:.1em .8em; font-size:var(--fs-big); font-weight:600; box-shadow:0 6px 0 var(--ink); }
.bubble::after{ content:""; position:absolute; left:40px; bottom:-26px; border:13px solid transparent; border-top-color:var(--ink); }
.toggle{ display:flex; border:5px solid var(--ink); border-radius:24px; overflow:hidden; box-shadow:0 6px 0 var(--ink); }
.toggle button{ border:0; font-size:clamp(18px,2.8vh,28px); font-weight:700; padding:.5em .9em; min-height:66px; background:#fff; }
.toggle button[aria-pressed="true"]{ background:var(--yellow); }
.yes{ background:var(--green); min-width:min(26vw,320px); }
.no{ background:#FF6B6B; min-width:min(26vw,320px); }
.shake{ animation:shake .5s; }
@keyframes shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-14px)} 40%{transform:translateX(12px)} 60%{transform:translateX(-8px)} 80%{transform:translateX(5px)} }
.toy .wig{ transform-box:fill-box; transform-origin:50% 95%; animation:wig 2.6s ease-in-out infinite; }
@keyframes wig{ 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
.toy.drop{ transform-box:fill-box; transform-origin:50% 100%; animation:drop .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes drop{ 0%{transform:translateY(-60px) scale(1.2)} 60%{transform:translateY(0) scale(1.1,.88)} 100%{transform:none} }
.toy.glow{ filter:drop-shadow(0 0 6px #FFF200) drop-shadow(0 0 14px #FF8A1F); }
.toy.glow .wig{ animation:wig .5s ease-in-out infinite; }
.ring{ fill:none; stroke:#FFF200; stroke-width:8; filter:drop-shadow(0 0 8px #FF8A1F); transform-box:fill-box; transform-origin:center; animation:ring 1s ease-in-out infinite; }
@keyframes ring{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
#end{ justify-content:center; gap:4vh; text-align:center; }
.score{ font-size:clamp(50px,12vh,130px); font-weight:700; color:#fff; -webkit-text-stroke:5px var(--ink); paint-order:stroke fill; }
.endBtns{ display:flex; gap:3vw; flex-wrap:wrap; justify-content:center; }
#fx{ position:fixed; inset:0; pointer-events:none; z-index:60; }
.burst{ position:fixed; z-index:61; pointer-events:none; font-size:44px; transform:translate(-50%,-50%); }
@media (prefers-reduced-motion:reduce){ .toy .wig,.shelfToy,.title span,.toyrow span,.next,.ring{ animation:none !important; } }
@media (max-width:700px){ .bar{ padding-right:150px; } .gameName{ display:none; } }
</style>
</head>
<body>
<div id="corner">
  <button id="muteBtn" aria-label="Mute sound" class="emoji">🔊</button>
  <button id="fsBtn" aria-label="Full screen">⛶</button>
</div>

<section id="start" class="screen on">
  <h1 class="title"><span>Toy</span> <span style="animation-delay:.2s">Room</span> <span style="animation-delay:.4s">Fun!</span></h1>
  <div class="toyrow" aria-hidden="true" data-toys="teddy,rockingHorse,kite,bike,windmill,train"></div>
  <button id="startBtn" class="chunky">Start ▶</button>
</section>

<section id="home" class="screen">
  <h1 class="title"><span>Toy</span> <span style="animation-delay:.2s">Room</span> <span style="animation-delay:.4s">Fun!</span></h1>
  <div class="toyrow" aria-hidden="true" data-toys="doll,block,robot,tricycle,plane,car,ball"></div>
  <div class="menu">
    <button class="chunky" style="background:var(--yellow)" data-game="1">1. Put the toy!</button>
    <button class="chunky" style="background:var(--blue)" data-game="2">2. Where is it?</button>
    <button class="chunky" style="background:var(--pink)" data-game="3">3. Yes or No?</button>
  </div>
</section>

<section id="game" class="screen">
  <div class="bar">
    <button class="chunky homeBtn" id="homeBtn"><span class="emoji">🏠</span> Home</button>
    <div class="gameName" id="gameName"></div>
    <div class="stars emoji" id="stars" aria-label="Stars"></div>
  </div>
  <div class="card" id="card">
    <div class="count" id="count"></div>
    <div class="sentence" id="sentence" aria-live="polite"></div>
    <button class="chunky listen" id="listenBtn"><span class="emoji">🔊</span> Listen again</button>
  </div>
  <div class="roomWrap"><svg id="room" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid meet" aria-label="A child’s room with a bed, a toy box, a table with a computer, a chair and a school bag"></svg></div>
  <div class="controls" id="controls">
    <div class="shelf hidden" id="shelf"><div class="shelfToy" id="shelfToy"></div></div>
    <div class="choices hidden" id="choices" role="group" aria-label="Choose the answer"></div>
    <div class="toggle hidden" id="toggle">
      <button id="orderBtn" aria-pressed="true">In order</button>
      <button id="randomBtn" aria-pressed="false">Random</button>
    </div>
    <button class="chunky yes hidden" id="yesBtn"><span class="emoji">✅</span> Yes</button>
    <button class="chunky no hidden" id="noBtn"><span class="emoji">❌</span> No</button>
    <button class="chunky next hidden" id="nextBtn">Next ▶</button>
  </div>
</section>

<section id="end" class="screen">
  <h1 class="title"><span>Hooray!</span></h1>
  <div class="score" id="score"></div>
  <div class="endBtns">
    <button class="chunky" style="background:var(--green)" id="againBtn">Play again</button>
    <button class="chunky" style="background:var(--yellow)" id="endHomeBtn"><span class="emoji">🏠</span> Home</button>
  </div>
</section>

<canvas id="fx"></canvas>

let ac = null;
function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==="suspended") ac.resume(); return ac; }
function tone(freq, start, dur, type="sine", vol=.25, endFreq=null){
  const c = audio(); if(!c || muted) return;
  const t = c.currentTime + start, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.02); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const sfx = {
  ding(){ tone(880,0,.25,"sine",.25); tone(1320,.12,.4,"sine",.22); tone(1760,.24,.5,"triangle",.12); },
  boing(){ tone(320,0,.45,"sine",.3,110); tone(330,.02,.4,"triangle",.1,120); },
  pop(){ tone(500,0,.09,"triangle",.25,1100); },
  fanfare(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.16,.35,"square",.08)); tone(1047,.64,.8,"triangle",.2); tone(784,.64,.8,"sine",.12); }
};
let voice = null;
function chooseVoice(){ const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || []; voice = vs.find(v=>v.lang==="en-GB") || vs.find(v=>/^en[-_]GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
if(window.speechSynthesis){ chooseVoice(); speechSynthesis.onvoiceschanged = chooseVoice; }
function say(text){
  if(muted || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[’]/g,"'"));
  u.rate = .8; u.lang = voice ? voice.lang : "en-GB"; if(voice) u.voice = voice;
  speechSynthesis.speak(u);
}

const fx = $("fx"), ctx = fx.getContext("2d");
let bits = [], fxRunning = false;
function sizeFx(){ fx.width = innerWidth*devicePixelRatio; fx.height = innerHeight*devicePixelRatio; }
addEventListener("resize", sizeFx); sizeFx();
const COLS = ["#FFD23F","#3EC1F3","#FF5DA2","#3DCC6B","#FF8A1F","#9B6BFF"];
function confetti(n=120, fromTop=false, x=innerWidth/2, y=innerHeight/2){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) n = Math.min(n,30);
  for(let i=0;i<n;i++){
    bits.push(fromTop
      ? { x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*.5, vx:(Math.random()-.5)*2, vy:2+Math.random()*3, r:Math.random()*6.28, vr:(Math.random()-.5)*.3, c:pick(COLS), s:8+Math.random()*10, life:400 }
      : { x, y, vx:(Math.random()-.5)*16, vy:-6-Math.random()*12, r:Math.random()*6.28, vr:(Math.random()-.5)*.4, c:pick(COLS), s:8+Math.random()*9, life:140 });
  }
  if(!fxRunning){ fxRunning = true; requestAnimationFrame(tick); }
}
function tick(){
  const d = devicePixelRatio; ctx.clearRect(0,0,fx.width,fx.height);
  bits = bits.filter(b=>b.life-- > 0 && b.y < innerHeight+40);
  for(const b of bits){ b.vy = Math.min(b.vy+.35, 7); b.x += b.vx; b.y += b.vy; b.vx *= .985; b.r += b.vr;
    ctx.save(); ctx.translate(b.x*d,b.y*d); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.s*d/2,-b.s*d/4,b.s*d,b.s*d/2); ctx.restore(); }
  if(bits.length) requestAnimationFrame(tick); else { fxRunning = false; ctx.clearRect(0,0,fx.width,fx.height); }
}
function starBurst(x,y){
  for(let i=0;i<8;i++){
    const s = document.createElement("div"); s.className = "burst emoji"; s.textContent = "⭐";
    s.style.left = x+"px"; s.style.top = y+"px"; document.body.appendChild(s);
    const a = i/8*Math.PI*2, dist = 110+Math.random()*40;
    s.animate([{transform:"translate(-50%,-50%) scale(.3)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*dist}px), calc(-50% + ${Math.sin(a)*dist}px)) scale(1.2) rotate(180deg)`,opacity:0}],{duration:800,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish = ()=>s.remove();
  }
}
function celebrate(el){ const r = el.getBoundingClientRect(), x = r.left+r.width/2, y = r.top+r.height/2; sfx.ding(); starBurst(x,y); confetti(90,false,x,y); }

/* ---------- the room ---------- */
const room = $("room");
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
let roomBuilt = false;
function drawRoom(){
  if(!roomBuilt){
    el("image", { href:ROOM_IMG, x:0, y:0, width:1672, height:941, preserveAspectRatio:"none" }, room);
    el("g", { id:"L_back" }, room);
    OVERLAYS.forEach(o=>el("image", { href:o.src, x:o.x, y:o.y, width:o.w, height:o.h, "pointer-events":"none" }, room));
    el("g", { id:"L_front" }, room);
    el("rect", { id:"dropGlow", rx:22, fill:"rgba(255,255,255,.35)", stroke:"#fff", "stroke-width":6, "stroke-dasharray":"16 12", visibility:"hidden" }, room);
    el("g", { id:"L_fx" }, room);
    roomBuilt = true;
  }
  ["L_back","L_front","L_fx"].forEach(id=>$(id).innerHTML="");
}
function addToy(key, zoneName, cls=""){
  const im = IMG[key]; const [cx, bottom, size, layer] = ZONES[zoneName].pos;
  const ar = im.w/im.h, w = ar>=1 ? size : size*ar, h = ar>=1 ? size/ar : size;
  const g = el("g", { class:"toy "+cls, "data-toy":key }, $(layer==="back" ? "L_back" : "L_front"));
  const wg = el("g", { class:"wig" }, g); wg.style.animationDelay = (-Math.random()*2.6)+"s";
  el("image", { href:im.src, x:cx-w/2, y:bottom-h, width:w, height:h }, wg);
  return g;
}
function ringFor(key){ const r = TOYS[key].ring; return el("rect", { x:r[0], y:r[1], width:r[2]-r[0], height:r[3]-r[1], rx:24, class:"ring" }, $("L_fx")); }
function svgPoint(x,y){ const p = room.createSVGPoint(); p.x = x; p.y = y; return p.matrixTransform(room.getScreenCTM().inverse()); }
const inRect = (p,h) => h && p.x>=h[0] && p.x<=h[2] && p.y>=h[1] && p.y<=h[3];
function zoneAt(p){ for(const [k,z] of Object.entries(ZONES)){ if(inRect(p,z.hit) || inRect(p,z.hit2)) return k; } return null; }
const toyImg = k => `<img src="${IMG[k].src}" alt="">`;

/* ============================================================
   SCREENS + SHARED UI
   ============================================================ */
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id)); }
let game = 0, round = 0, stars = 0, firstTry = true, total = 0, current = "";
function setStars(n){ total = n; $("stars").innerHTML = Array.from({length:n},()=>"<span>⭐</span>").join(""); }
function earnStar(){ if(!firstTry) return; const s = $("stars").children[stars]; if(s) s.classList.add("on"); stars++; }
function setCard(count, html, speak){
  $("count").textContent = count; $("sentence").innerHTML = html;
  const c = $("card"); c.classList.remove("slide"); void c.offsetWidth; c.classList.add("slide");
  current = speak; say(speak);
}
function controls(list){ ["shelf","choices","toggle","yesBtn","noBtn","nextBtn"].forEach(id=>$(id).classList.toggle("hidden", !list.includes(id))); }
function startGame(n){
  game = n; round = 0; stars = 0;
  $("gameName").textContent = ["","Put the toy!","Where is it?","Yes or No?"][n];
  show("game");
  if(n===1){ setStars(GAME1.length); g1Round(); }
  if(n===2){ setStars(GAME2.length); g2Round(); }
  if(n===3){ setStars(GAME3.reduce((a,p)=>a+p.sentences.length,0)); g3Round(); }
}
function nextRound(){
  sfx.pop(); round++;
  if(game===1) round < GAME1.length ? g1Round() : finish();
  if(game===2) round < GAME2.length ? g2Round() : finish();
  if(game===3) round < total ? g3Round() : finish();
}
function finish(){
  show("end"); $("score").innerHTML = `${stars} / ${total} <span class="emoji">⭐</span>`;
  sfx.fanfare(); confetti(260,true);
  say(stars===total ? "Fantastic! You got all the stars!" : "Well done! Let’s play again!");
}

/* ============================================================
   GAME 1 — drag and drop
   ============================================================ */
function g1Round(){
  const r = GAME1[round]; firstTry = true; drawRoom();
  const text = `Put the ${N(r.toy)} ${r.where}.`;
  setCard(`${round+1} / ${GAME1.length}`, `Put the ${N(r.toy)} <b>${r.where}</b>.`, text);
  $("shelfToy").innerHTML = toyImg(r.toy); $("shelfToy").classList.remove("gone");
  controls(["shelf"]);
}
let ghost = null, dragging = false;
$("shelfToy").addEventListener("pointerdown", e=>{
  if(game!==1 || $("shelfToy").classList.contains("gone")) return;
  e.preventDefault(); audio(); sfx.pop(); dragging = true;
  const st = $("shelfToy"); st.setPointerCapture(e.pointerId);
  const ir = st.querySelector("img").getBoundingClientRect();
  ghost = document.createElement("div"); ghost.className = "ghost"; ghost.innerHTML = st.innerHTML;
  ghost.style.height = ir.height+"px"; ghost.style.left = e.clientX+"px"; ghost.style.top = e.clientY+"px";
  document.body.appendChild(ghost); st.classList.add("gone");
});
$("shelfToy").addEventListener("pointermove", e=>{
  if(!dragging) return;
  ghost.style.left = e.clientX+"px"; ghost.style.top = e.clientY+"px";
  const z = zoneAt(svgPoint(e.clientX,e.clientY)), glow = $("dropGlow");
  if(z){ const h = inRect(svgPoint(e.clientX,e.clientY), ZONES[z].hit) ? ZONES[z].hit : ZONES[z].hit2; glow.setAttribute("x",h[0]); glow.setAttribute("y",h[1]); glow.setAttribute("width",h[2]-h[0]); glow.setAttribute("height",h[3]-h[1]); glow.setAttribute("visibility","visible"); }
  else glow.setAttribute("visibility","hidden");
});
function endDrag(e){
  if(!dragging) return; dragging = false;
  $("dropGlow").setAttribute("visibility","hidden");
  const r = GAME1[round], rr = room.getBoundingClientRect();
  const inside = e.clientX>=rr.left && e.clientX<=rr.right && e.clientY>=rr.top && e.clientY<=rr.bottom;
  const z = inside ? zoneAt(svgPoint(e.clientX,e.clientY)) : null;
  if(z && r.ok.includes(z)){
    ghost.remove(); ghost = null;
    const g = addToy(r.toy, z, "drop");
    earnStar(); celebrate(g);
    const p = pick(PRAISE); setTimeout(()=>say(p), 150);
    controls(["shelf","nextBtn"]);
  } else {
    const sr = $("shelfToy").getBoundingClientRect(), gh = ghost;
    gh.classList.add("back"); gh.style.left = (sr.left+sr.width/2)+"px"; gh.style.top = (sr.top+sr.height/2)+"px";
    setTimeout(()=>{ gh.remove(); $("shelfToy").classList.remove("gone"); }, 460);
    ghost = null;
    if(inside){ firstTry = false; sfx.boing(); say("Try again!"); $("card").classList.remove("shake"); void $("card").offsetWidth; $("card").classList.add("shake"); }
  }
}
$("shelfToy").addEventListener("pointerup", endDrag);
$("shelfToy").addEventListener("pointercancel", endDrag);

/* ============================================================
   GAME 2 — where is it?
   ============================================================ */
let g2Random = false, g2Item = null, g2Target = null;
function g2Round(){
  firstTry = true; drawRoom();
  g2Item = g2Random ? { toy:pick(MOVABLE), place:pick(RANDOM_PLACES) } : GAME2[round];
  const fixed = TOYS[g2Item.toy].fixed;
  g2Target = fixed ? null : addToy(g2Item.toy, g2Item.place);
  const blocked = [g2Item.place, ...(CLASH[g2Item.place]||[])];
  const freePlaces = RANDOM_PLACES.filter(p=>!blocked.includes(p)).sort(()=>Math.random()-.5);
  const others = MOVABLE.filter(t=>t!==g2Item.toy).sort(()=>Math.random()-.5);
  const used = [];
  for(const p of freePlaces){
    if(used.length >= DISTRACTORS) break;
    if(used.some(u=>u===p || (CLASH[u]||[]).includes(p))) continue;
    addToy(others[used.length], p); used.push(p);
  }
  const t = TOYS[g2Item.toy], start = t.plural ? "They’re" : "It’s";
  const q = t.plural ? `Where are the ${t.name}?` : `Where’s the ${t.name}?`;
  setCard(`${round+1} / ${GAME2.length}`, t.plural ? `Where are the <b>${t.name}</b>?` : `Where’s the <b>${t.name}</b>?`, q);
  // four answers: the right place, the places of the other toys in the room, then other places
  const right = ZONES[g2Item.place].label;
  const pool = [...used.map(p=>ZONES[p].label), ...Object.keys(ZONES).map(k=>ZONES[k].label).sort(()=>Math.random()-.5)];
  const opts = [right];
  for(const lab of pool){ if(opts.length>=4) break; if(!opts.includes(lab)) opts.push(lab); }
  opts.sort(()=>Math.random()-.5);
  g2Done = false;
  $("choices").innerHTML = opts.map((lab,i)=>`<button class="choice" data-right="${lab===right}" data-say="${start} ${lab}."><span class="letter">${"ABCD"[i]}</span><span>${start} ${lab}.</span></button>`).join("");
  controls(["choices","toggle"]);
}
let g2Done = false;
function g2Answer(btn){
  if(g2Done || btn.disabled) return; audio();
  if(btn.dataset.right==="true"){
    g2Done = true;
    const t = TOYS[g2Item.toy], lab = ZONES[g2Item.place].label, start = t.plural ? "They’re" : "It’s";
    btn.classList.add("right");
    $("choices").querySelectorAll(".choice").forEach(b=>b.disabled = true);
    $("sentence").innerHTML = `${start} <b>${lab}</b>.`;
    current = `${start} ${lab}.`; say(`${pick(PRAISE)} ${current}`);
    const target = g2Target || ringFor(g2Item.toy);
    if(g2Target) g2Target.classList.add("glow");
    celebrate(target); earnStar();
    controls(["choices","nextBtn"]);
  } else {
    firstTry = false; sfx.boing(); say("Try again!");
    btn.classList.add("bad","shake"); btn.disabled = true;
  }
}
$("choices").addEventListener("click", e=>{ const b = e.target.closest(".choice"); if(b) g2Answer(b); });
function setMode(random){
  g2Random = random;
  $("orderBtn").setAttribute("aria-pressed", String(!random)); $("randomBtn").setAttribute("aria-pressed", String(random));
  sfx.pop(); startGame(2);
}
$("orderBtn").addEventListener("click", ()=>setMode(false));
$("randomBtn").addEventListener("click", ()=>setMode(true));

/* ============================================================
   GAME 3 — yes or no
   ============================================================ */
let g3Done = false;
function g3Where(i){ let n = i; for(const p of GAME3){ if(n < p.sentences.length) return [p, p.sentences[n], n]; n -= p.sentences.length; } }
function g3Round(){
  const [pic, s, idx] = g3Where(round); firstTry = true; g3Done = false;
  if(idx===0){ drawRoom(); pic.toys.forEach(([t,z])=>addToy(t,z)); }
  document.querySelectorAll(".toy.glow").forEach(g=>g.classList.remove("glow"));
  setCard(`${pic.name}: ${round+1} / ${total}`, s.text, s.text);
  controls(["yesBtn","noBtn"]);
}
function g3Answer(yes, btn){
  if(g3Done) return; audio();
  const [, s] = g3Where(round);
  if(yes===s.answer){
    g3Done = true;
    const g = document.querySelector(`#room .toy[data-toy="${s.toy}"]`);
    if(g){ g.classList.add("glow"); celebrate(g); } else sfx.ding();
    earnStar(); say(pick(PRAISE));
    $("sentence").innerHTML = `${s.text} <b>${s.answer ? "Yes!" : "No!"}</b>`;
    controls(["nextBtn"]);
  } else {
    firstTry = false; sfx.boing(); say("Try again!");
    btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake");
  }
}
$("yesBtn").addEventListener("click", e=>g3Answer(true, e.currentTarget));
$("noBtn").addEventListener("click", e=>g3Answer(false, e.currentTarget));

/* ============================================================
   WIRING
   ============================================================ */
document.querySelectorAll(".toyrow[data-toys]").forEach(row=>{
  row.innerHTML = row.dataset.toys.split(",").map((k,i)=>`<span style="animation-delay:${i*.15}s">${toyImg(k)}</span>`).join("");
});
$("startBtn").addEventListener("click", ()=>{ audio(); sfx.fanfare(); say("Let’s play!"); show("home"); });
document.querySelectorAll(".menu .chunky").forEach(b=>b.addEventListener("click", ()=>{ audio(); sfx.pop(); startGame(+b.dataset.game); }));
$("homeBtn").addEventListener("click", ()=>{ sfx.pop(); if(window.speechSynthesis) speechSynthesis.cancel(); show("home"); });
$("endHomeBtn").addEventListener("click", ()=>{ sfx.pop(); show("home"); });
$("againBtn").addEventListener("click", ()=>{ sfx.pop(); startGame(game); });
$("nextBtn").addEventListener("click", nextRound);
$("listenBtn").addEventListener("click", ()=>{ audio(); say(current); });
$("muteBtn").addEventListener("click", ()=>{
  muted = !muted; $("muteBtn").textContent = muted ? "🔇" : "🔊";
  $("muteBtn").setAttribute("aria-label", muted ? "Turn sound on" : "Mute sound");
  if(muted && window.speechSynthesis) speechSynthesis.cancel();
});
$("fsBtn").addEventListener("click", ()=>{
  try{
    if(!document.fullscreenElement) (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
    else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }catch(e){}
});
</script>
